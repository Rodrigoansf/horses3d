name: build docs
on:
  push:
    branches: [review5-docs]
jobs:

  Build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        gcc_v: [14] # Version of GFortran we want to use.
        python-version: ['3.12']
    env:
      FC: gfortran-${{ matrix.gcc_v }}
      GCC_V: ${{ matrix.gcc_v }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      if: contains( matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt install -y gfortran-${GCC_V} python3-dev graphviz
        python -m pip install --upgrade pip
        pip install ford markdown


    - name: Build documentation
      run: ford doc/ford-project-file.md

    - name: Check the new page
      run: |
        ls -la doc/doc_output/page/user_manual/ | head -40
        f=$(grep -l "Verification with manufactured solutions" -r doc/doc_output/page/user_manual/ | head -5); echo "$f"
        test -n "$f"
        grep -o "s-verification[^\"]*" doc/doc_output/page/user_manual/index.html | sort -u
        pip show ford | head -2
